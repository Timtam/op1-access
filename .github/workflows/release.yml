# Publishes a release. Start it by hand: Actions, Release, Run workflow.
# It turns the "Unreleased" section of CHANGELOG.md into the new version, sets the version in
# Directory.Build.props, builds everything, commits and tags "Release vX.Y.Z" and publishes a
# GitHub release with the changelog section as notes and the ZIP and the installer as downloads.
# The mod (F5 in the game) and the installer find updates through the latest release of this
# repository.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise (not used for the first release or when a version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead, for example 1.0.0 (optional)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags tell which versions exist

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: tools
          key: deps-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Roll the changelog and set the version
        id: prepare
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-prepare.ps1 -Bump $env:BUMP -Version $env:VERSION -NotesFile dist/release-notes.md

      # The Static Forms key for problem reports goes into the installer at build time, from the
      # repository secret STATICFORMS_KEY (Settings, Secrets and variables, Actions). Without the
      # secret the release has no report function (F1 says so, the installer's button is off).
      - name: Build and package
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          OP1_STATICFORMS_KEY: ${{ secrets.STATICFORMS_KEY }}
        run: ./scripts/build-release.ps1 -RepositorySlug $env:REPOSITORY

      - name: Commit and tag
        shell: pwsh
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Directory.Build.props
          git commit -m "Release v$env:VERSION"
          git tag -a "v$env:VERSION" -m "OP1 Access $env:VERSION"
          git push origin "HEAD:refs/heads/$env:BRANCH"
          git push origin "refs/tags/v$env:VERSION"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.prepare.outputs.version }}
          name: OP1 Access ${{ steps.prepare.outputs.version }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/OP1Access-${{ steps.prepare.outputs.version }}.zip
            dist/OP1AccessInstaller.exe
            dist/SHA256SUMS.txt
